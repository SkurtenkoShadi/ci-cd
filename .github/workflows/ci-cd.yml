name: CI/CD Pipeline for Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.x
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        flake8 hello_script.py test_hello_script.py --count --show-source --statistics --max-line-length=127

    - name: Run tests with pytest
      run: |
        python -m pytest test_hello_script.py -v --cov=hello_script --cov-report=term-missing

    - name: Build package
      run: |
        if [ -f setup.py ]; then
          python setup.py build
        else
          echo "No setup.py found, skipping build"
        fi

    - name: Deploy artifact to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: python-package
        path: build/
        retention-days: 7
